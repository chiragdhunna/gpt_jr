name: Build and Distribute APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK and Upload to Firebase
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
      FASTLANE_FIREBASE_APP_ID: ${{ secrets.FASTLANE_FIREBASE_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks

      - name: Decode Firebase service account (optional)
        run: |
          firebase_credentials_file="${RUNNER_TEMP}/firebase_service_account.json"
          firebase_credentials_json='${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          firebase_credentials_b64='${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}'
          if [ -n "$firebase_credentials_json" ]; then
            printf '%s' "$firebase_credentials_json" > "$firebase_credentials_file"
          elif [ -n "$firebase_credentials_b64" ]; then
            if ! printf '%s' "$firebase_credentials_b64" | base64 --decode > "$firebase_credentials_file"; then
              rm -f "$firebase_credentials_file"
              echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON_B64 could not be base64-decoded. Falling back to FIREBASE_CLI_TOKEN if available."
            fi
          fi

          if [ -f "$firebase_credentials_file" ]; then
            if [ ! -s "$firebase_credentials_file" ]; then
              rm -f "$firebase_credentials_file"
              echo "::warning::Firebase service account secret is empty. Falling back to FIREBASE_CLI_TOKEN if available."
            elif ! jq empty "$firebase_credentials_file" > /dev/null 2>&1; then
              rm -f "$firebase_credentials_file"
              echo "::warning::Firebase service account secret is not valid JSON. Falling back to FIREBASE_CLI_TOKEN if available."
            else
              echo "FIREBASE_SERVICE_CREDENTIALS_FILE=$firebase_credentials_file" >> "$GITHUB_ENV"
            fi
          fi

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Build and distribute using Fastlane
        run: |
          cd android
          bundle exec fastlane firebase

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: "Automated release from GitHub Actions"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
